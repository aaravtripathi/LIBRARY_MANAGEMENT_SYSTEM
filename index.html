<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPOnline Enterprise Library Management System</title>
    <meta http-equiv="refresh" content="0; url=./LIBRARY/index.html">
    <style>
        :root {
            --canvas: #0e131a;
            --surface: #171d25;
            --ink: #edf1f6;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body {
            background-color: var(--canvas);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .launcher-card {
            background-color: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 40px;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        .logo-wrap {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: white;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 15px; color: #a1a8b5; line-height: 1.6; margin-bottom: 28px; }
        .launch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
        }
        .launch-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }
        .footer { font-size: 13px; color: #64748b; margin-top: 32px; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="launcher-card">
        <div class="logo-wrap">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-0.5-5.006L20 17"></path>
            </svg>
        </div>
        <h1>Enterprise Library Portal</h1>
        <p>You are entering the MPOnline Library Management System interactive web application. If you are not redirected automatically, please click the launch button below.</p>
        <a href="./LIBRARY/index.html" class="launch-btn">Launch Library System</a>
        <div class="footer">
            MPOnline Advanced Software Engineering Internship &bull; Aarav Tripathi
        </div>
    </div>
    <script>
        window.location.href = "./LIBRARY/index.html";
    </script>
</body>
</html>
