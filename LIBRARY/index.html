<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management - Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="dashboard.html" aria-label="Library Management home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5A3.5 3.5 0 0 1 7 2h3.5a2 2 0 0 1 1.5.7V20a2 2 0 0 0-1.5-.7H7A3.5 3.5 0 0 0 3.5 23V5.5Zm17 0A3.5 3.5 0 0 0 17 2h-3.5a2 2 0 0 0-1.5.7V20a2 2 0 0 1 1.5-.7H17a3.5 3.5 0 0 1 3.5 3V5.5Z"/></svg>
        <span>Library Management</span>
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a class="nav-link" href="dashboard.html"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 2-5 3 2 3-5 3 5 3-2 2 5v6H4v-6Z"/><path d="M8 19v-3m4 3v-5m4 5v-3"/></svg>Dashboard</a>
        <a class="nav-link" href="books.html"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5A3.5 3.5 0 0 1 7 2h3.5a2 2 0 0 1 1.5.7V20a2 2 0 0 0-1.5-.7H7A3.5 3.5 0 0 0 3.5 23V5.5Zm17 0A3.5 3.5 0 0 0 17 2h-3.5a2 2 0 0 0-1.5.7V20a2 2 0 0 1 1.5-.7H17a3.5 3.5 0 0 1 3.5 3V5.5Z"/></svg>Books</a>
        <a class="nav-link" href="students.html"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2M3 12a3 3 0 0 1 3-3m12 0a3 3 0 0 1 3 3M4 21v-1a5 5 0 0 1 2-4.1m14 0A5 5 0 0 1 22 20v1"/></svg>Students</a>
        <a class="nav-link" href="librarians.html"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="12" height="15" rx="2"/><circle cx="9" cy="8" r="2"/><path d="M5.5 14c1.8-2.3 5.2-2.3 7 0M18 7h3v14H8"/></svg>Librarians</a>
        <a class="nav-link" href="history.html"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3.5 2"/></svg>Borrow History</a>
      </nav>
      <div class="account-actions">
        <a class="nav-link active" href="index.html"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h5v18h-5M11 7l4 5-4 5M15 12H3"/></svg>Login</a>
        <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode">
          <span class="theme-track" aria-hidden="true">
            <span class="theme-thumb">
              <span class="theme-moon">☾</span>
              <span class="theme-sun">☀</span>
            </span>
          </span>
        </button>
      </div>
    </header>

    <main id="app" class="app-shell">
      <section class="login-page">
        <div class="login-card">
          <aside class="welcome-panel">
            <div class="round-book">▣</div>
            <h1>Welcome Back!</h1>
            <div class="gold-line"></div>
            <p>Sign in to access your library<br />management dashboard.</p>
            <div class="book-stack">
              <span></span><span></span><span></span><span></span>
            </div>
          </aside>
          <section class="login-form-area">
            <h2>Sign In</h2>
            <p>Enter your credentials to continue</p>
            <form action="dashboard.html" method="GET">
              <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" placeholder="Enter username" required value="aaravtripathi" />
              </div>
              <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter pw" required value="password" />
              </div>
              <p class="form-error" id="login-error"></p>
              <button class="primary" type="submit">
                <span aria-hidden="true">⇥</span> &nbsp; Login
              </button>
            </form>
            <div class="or-divider">or</div>
            <p class="helper-note">Administrator username: <b>aaravtripathi</b></p>
          </section>
        </div>
      </section>
    </main>

    <footer><span>▣</span> © 2026 · <strong>Library Management System</strong></footer>
    <script src="app.js"></script>
  </body>
</html>
